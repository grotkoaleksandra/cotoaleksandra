name: Keep Supabase awake

# Free Supabase projects pause after ~7 idle days, which silently breaks the
# contact form. This pings a tiny function every 2 days. If the ping fails
# (project paused, function gone), the run fails and GitHub emails the owner.

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # to reset GitHub's 60-day "inactive repo" timer on this schedule

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive (and check the contact form answers)
        run: |
          set -e
          base=https://vnkwdfbwplgkcjgvvixp.supabase.co/functions/v1
          for i in 1 2 3; do
            if curl -fsS --max-time 30 "$base/keepalive"; then ok=1; break; fi
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "::error::Supabase keepalive failed: the project may be paused. Resume it at https://supabase.com/dashboard/project/vnkwdfbwplgkcjgvvixp"; exit 1; }
          curl -fsS --max-time 30 -X OPTIONS -H "Origin: https://cotoaleksandra.com" "$base/contact-form" >/dev/null \
            || { echo "::error::contact-form function is not answering"; exit 1; }
          echo; echo "awake ✓"
      - name: Stop GitHub from switching this schedule off
        # GitHub disables scheduled workflows after 60 days without repo
        # activity. Toggling the workflow resets that clock.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/disable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
